openapi: 3.0.3
info:
  title: Vinta Boilerplate API
  version: 0.1.0
  description: A Django project boilerplate with Vinta's best practices
paths:
  /api/payments:
    post:
      operationId: api_payments_create
      description: Create a payment with idempotency support.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique key to safely retry this request without creating duplicate
          payments.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{payment_id}:
    get:
      operationId: api_payments_retrieve
      description: Get payment status and ledger history.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{payment_id}/replay:
    post:
      operationId: api_payments_replay_create
      description: 'Admin-only: re-request a stuck payment''s result from the processor.'
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /processor/charge:
    post:
      operationId: processor_charge_create
      description: |-
        Charge a tokenized payment method.

        Returns a processor_reference. The final result arrives via webhook.
      tags:
      - processor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Charge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Charge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Charge'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /processor/tokenize:
    post:
      operationId: processor_tokenize_create
      description: |-
        Tokenize card or bank details.

        Accepts card details (number, expiry, CVV) or bank details
        (account_number, routing_number) and returns a token.
      tags:
      - processor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tokenize'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tokenize'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tokenize'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /webhooks/processor:
    post:
      operationId: webhooks_processor_create
      description: Receive and process processor webhooks.
      tags:
      - webhooks
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Charge:
      type: object
      properties:
        token:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          default: USD
      required:
      - amount
      - token
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_id:
          type: string
          maxLength: 255
        status:
          type: string
          maxLength: 10
        failure_code:
          type: string
          nullable: true
          maxLength: 50
        occurred_at:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - event_id
      - id
      - occurred_at
      - status
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MethodEnum:
      enum:
      - card
      - bank
      type: string
      description: |-
        * `card` - card
        * `bank` - bank
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 255
        is_active:
          type: boolean
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Amount in minor units
        currency:
          type: string
          maxLength: 3
        payment_token:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/StatusEnum'
        failure_code:
          type: string
          nullable: true
          maxLength: 50
        processor_reference:
          type: string
          nullable: true
          maxLength: 255
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created
      - id
      - ledger
      - modified
      - payment_token
    PaymentCreate:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          default: USD
          maxLength: 3
        payment_token:
          type: string
          maxLength: 255
      required:
      - amount
      - payment_token
    StatusEnum:
      enum:
      - pending
      - succeeded
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `succeeded` - Succeeded
        * `failed` - Failed
    Tokenize:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
        card_number:
          type: string
        expiry:
          type: string
        cvv:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
      required:
      - method
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 255
        is_active:
          type: boolean
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - created
      - email
      - id
      - modified
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
